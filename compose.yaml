version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app

  gateway:
    build: ./gateway-api
    container_name: gateway
    volumes:
      - ./gateway-api:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq

  worker:
    build: ./worker-service
    container_name: worker
    volumes:
      - ./worker-service:/var/www/html
    depends_on:
      - rabbitmq