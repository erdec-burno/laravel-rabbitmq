services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app

  gateway:
    build: ./gateway-api
    container_name: gateway
    volumes:
      - ./gateway-api:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq

  worker:
    build: ./worker-service
    container_name: worker
    volumes:
      - ./worker-service:/var/www/html
    depends_on:
      - rabbitmq

  worker-fpm:
    build:
      context: ./worker-service
      dockerfile: Dockerfile.fpm
    container_name: worker-fpm
    volumes:
      - ./worker-service:/var/www/html
    depends_on:
      - rabbitmq

  worker-nginx:
    image: nginx:1.27-alpine
    container_name: worker-nginx
    volumes:
      - ./worker-service:/var/www/html
      - ./worker-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    depends_on:
      - worker-fpm
